<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" width="1100" height="610" role="img" aria-label="GOLD reference architecture in layers. Tools include knowledge search over company documents, stored in pgvector. People use the chat UI, API or CLI. The platform layer holds the orchestrator (identity, guardrails, memory, approvals), the agent registry, audit and tracing, and evaluation. Apps sit on the platform: Talk to your Data with a Definitions agent and a SQL agent, the Sales copilot with an Account agent that also reuses the other two, and your own app. Agents reach MCP tool servers, which reach Postgres through restricted logins with row-level security. Every model call goes to one OpenAI-compatible endpoint: a hosted API, or the LiteLLM gateway in front of vLLM or NVIDIA NIM.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1F22; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #5B6168; }
    .l { font-size: 12px; font-weight: 700; fill: #9A6B12; letter-spacing: 0.06em; }
    .p { font-size: 11.5px; font-weight: 600; fill: #6B7178; }
    .layer { fill: #FAFAF8; stroke: #E1E4E1; stroke-width: 1.2; }
    .box { fill: #FFFFFF; stroke: #C9CEC9; stroke-width: 1.3; }
    .gold { fill: #F6EEDC; stroke: #9A6B12; stroke-width: 1.5; }
    .yours { fill: #FFFFFF; stroke: #9A6B12; stroke-width: 1.4; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #6B7178; stroke-width: 1.5; }
    .dash { fill: none; stroke: #9A6B12; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7178"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A6B12"/></marker>
  </defs>
  <rect width="1100" height="610" rx="14" fill="#FFFFFF"/>

  <!-- 1. People -->
  <rect x="20" y="16" width="800" height="62" rx="10" class="layer"/>
  <text x="36" y="42" class="l">PEOPLE</text>
  <text x="36" y="60" class="s">signed in (OIDC / proxy)</text>
  <rect x="200" y="28" width="190" height="38" rx="19" class="box"/><text x="295" y="52" class="t" text-anchor="middle">Chat UI</text>
  <rect x="405" y="28" width="190" height="38" rx="19" class="box"/><text x="500" y="52" class="t" text-anchor="middle">REST API</text>
  <rect x="610" y="28" width="195" height="38" rx="19" class="box"/><text x="707" y="52" class="t" text-anchor="middle">CLI</text>
  <path d="M500,78 V102" class="line" marker-end="url(#a)"/><text x="508" y="95" class="p">HTTPS</text>

  <!-- 2. Platform -->
  <rect x="20" y="104" width="800" height="124" rx="10" class="layer"/>
  <text x="36" y="130" class="l">PLATFORM</text>
  <text x="36" y="148" class="s">gold/ · same for</text>
  <text x="36" y="164" class="s">every app</text>
  <rect x="200" y="118" width="148" height="96" rx="10" class="gold"/>
  <text x="274" y="143" class="t" text-anchor="middle">Orchestrator</text>
  <text x="274" y="164" class="s" text-anchor="middle">identity · guardrails</text>
  <text x="274" y="182" class="s" text-anchor="middle">memory · approvals</text>
  <text x="274" y="200" class="s" text-anchor="middle">feedback</text>
  <rect x="359" y="118" width="148" height="96" rx="10" class="gold"/>
  <text x="433" y="143" class="t" text-anchor="middle">Registry</text>
  <text x="433" y="164" class="s" text-anchor="middle">A2A Agent Cards</text>
  <text x="433" y="182" class="s" text-anchor="middle">agents join live</text>
  <rect x="518" y="118" width="140" height="96" rx="10" class="gold"/>
  <text x="588" y="143" class="t" text-anchor="middle">Audit, tracing</text>
  <text x="588" y="164" class="s" text-anchor="middle">OpenTelemetry</text>
  <text x="588" y="182" class="s" text-anchor="middle">JSON audit trail</text>
  <rect x="669" y="118" width="136" height="96" rx="10" class="gold"/>
  <text x="737" y="143" class="t" text-anchor="middle">Evaluation</text>
  <text x="737" y="164" class="s" text-anchor="middle">gold eval · bench</text>
  <text x="737" y="182" class="s" text-anchor="middle">NVIDIA AIPerf</text>
  <path d="M500,228 V252" class="line" marker-end="url(#a)"/><text x="508" y="245" class="p">A2A</text>

  <!-- 3. Apps -->
  <rect x="20" y="254" width="800" height="126" rx="10" class="layer"/>
  <text x="36" y="280" class="l">APPS</text>
  <text x="36" y="298" class="s">apps/ · a manifest,</text>
  <text x="36" y="314" class="s">agents and tools</text>
  <rect x="200" y="266" width="190" height="100" rx="10" class="box"/>
  <text x="295" y="290" class="t" text-anchor="middle">Talk to your Data</text>
  <text x="295" y="314" class="s" text-anchor="middle">Definitions agent</text>
  <text x="295" y="332" class="s" text-anchor="middle">SQL agent</text>
  <text x="295" y="352" class="s" text-anchor="middle">read-only</text>
  <rect x="405" y="266" width="190" height="100" rx="10" class="box"/>
  <text x="500" y="290" class="t" text-anchor="middle">Sales copilot</text>
  <text x="500" y="314" class="s" text-anchor="middle">Account agent</text>
  <text x="500" y="332" class="s" text-anchor="middle">+ Definitions, SQL (reused)</text>
  <text x="500" y="352" class="s" text-anchor="middle">writes need approval</text>
  <rect x="610" y="266" width="195" height="100" rx="10" class="yours"/>
  <text x="707" y="290" class="t" text-anchor="middle">Your app</text>
  <text x="707" y="314" class="s" text-anchor="middle">app.yaml</text>
  <text x="707" y="332" class="s" text-anchor="middle">agents · tools</text>
  <text x="707" y="352" class="s" text-anchor="middle">no platform changes</text>
  <path d="M500,380 V404" class="line" marker-end="url(#a)"/><text x="508" y="397" class="p">MCP</text>

  <!-- 4. Tools -->
  <rect x="20" y="406" width="800" height="84" rx="10" class="layer"/>
  <text x="36" y="432" class="l">TOOLS</text>
  <text x="36" y="450" class="s">MCP servers</text>
  <rect x="200" y="418" width="146" height="60" rx="10" class="box"/>
  <text x="273" y="442" class="t" text-anchor="middle">Data + glossary</text>
  <text x="273" y="462" class="s" text-anchor="middle">SQLGlot · dry-run cost</text>
  <rect x="354" y="418" width="146" height="60" rx="10" class="box"/>
  <text x="427" y="442" class="t" text-anchor="middle">CRM tools</text>
  <text x="427" y="462" class="s" text-anchor="middle">typed · approval gate</text>
  <rect x="508" y="418" width="146" height="60" rx="10" class="gold"/>
  <text x="581" y="442" class="t" text-anchor="middle">Knowledge</text>
  <text x="581" y="462" class="s" text-anchor="middle">RAG · by audience</text>
  <rect x="662" y="418" width="143" height="60" rx="10" class="yours"/>
  <text x="733" y="442" class="t" text-anchor="middle">Your tools</text>
  <text x="733" y="462" class="s" text-anchor="middle">any MCP server</text>
  <path d="M500,490 V514" class="line" marker-end="url(#a)"/><text x="508" y="507" class="p">SQL</text>

  <!-- 5. Data -->
  <rect x="20" y="516" width="800" height="78" rx="10" class="layer"/>
  <text x="36" y="542" class="l">DATA</text>
  <text x="36" y="560" class="s">your systems</text>
  <rect x="200" y="528" width="605" height="54" rx="10" class="box"/>
  <text x="502" y="551" class="t" text-anchor="middle">Postgres + pgvector (or your database)</text>
  <text x="502" y="570" class="s" text-anchor="middle">read-only login · column grants · row-level security · write-only CRM login · documents</text>

  <!-- Models -->
  <rect x="850" y="104" width="230" height="490" rx="12" class="layer"/>
  <text x="866" y="130" class="l">MODELS</text>
  <text x="866" y="148" class="s">one OpenAI-compatible</text>
  <text x="866" y="164" class="s">endpoint, three roles</text>
  <rect x="866" y="190" width="198" height="70" rx="10" class="gold"/>
  <text x="965" y="218" class="t" text-anchor="middle">LiteLLM gateway</text>
  <text x="965" y="240" class="s" text-anchor="middle">general · sql · embed</text>
  <path d="M965,260 V292" class="line" marker-end="url(#a)"/>
  <rect x="866" y="296" width="198" height="54" rx="10" class="box"/>
  <text x="965" y="320" class="t" text-anchor="middle">Hosted API</text>
  <text x="965" y="338" class="s" text-anchor="middle">stage 1</text>
  <rect x="866" y="362" width="198" height="54" rx="10" class="box"/>
  <text x="965" y="386" class="t" text-anchor="middle">Your fine-tuned model</text>
  <text x="965" y="404" class="s" text-anchor="middle">stage 2 · LoRA</text>
  <rect x="866" y="428" width="198" height="54" rx="10" class="box"/>
  <text x="965" y="452" class="t" text-anchor="middle">vLLM · NVIDIA NIM</text>
  <text x="965" y="470" class="s" text-anchor="middle">stage 3 · your GPUs</text>
  <text x="965" y="520" class="s" text-anchor="middle">Nemotron profile included</text>
  <text x="965" y="540" class="s" text-anchor="middle">gateway optional with</text>
  <text x="965" y="556" class="s" text-anchor="middle">a single hosted API</text>
  <path d="M820,166 H850" class="dash" marker-end="url(#g)"/>
  <path d="M820,316 H850" class="dash" marker-end="url(#g)"/>
</svg>
