{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- $name := include "gold.fullname" . -}}
{{- /* Who may call each component. Egress is left open for model endpoints. */}}
{{- $callers := dict
      "registry"          (list "orchestrator" "sql-agent" "definitions-agent")
      "sql-agent"         (list "orchestrator")
      "definitions-agent" (list "orchestrator")
      "mcp-data"          (list "sql-agent")
      "mcp-glossary"      (list "definitions-agent")
      "postgres"          (list "mcp-data" "mcp-glossary")
      "scripted-model"    (list "orchestrator" "sql-agent" "definitions-agent")
      "gateway"           (list "orchestrator" "sql-agent" "definitions-agent") -}}
{{- range $target, $from := $callers }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-{{ $target }}
  labels: {{- include "gold.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $target }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range $from }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/component: {{ . }}
        {{- end }}
---
{{- end }}
{{- end }}
