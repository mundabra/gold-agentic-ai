{{- if .Values.guardrails.enabled }}
{{- $name := include "gold.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-guardrails
  labels: {{- include "gold.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/guardrails/*").AsConfig | indent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-guardrails
  labels:
    {{- include "gold.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: guardrails
  template:
    metadata:
      labels:
        {{- include "gold.labels" . | nindent 8 }}
        app.kubernetes.io/component: guardrails
      annotations:
        checksum/config: {{ (.Files.Glob "files/guardrails/*").AsConfig | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: guardrails
          image: {{ .Values.guardrails.image }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: GUARDRAILS_CONFIG_DIR
              value: /config-src
            - name: GUARDRAILS_MODEL_BASE_URL
              value: {{ include "gold.llmBaseUrl" . | quote }}
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "gold.llmSecret" . }}, key: apiKey } }
          readinessProbe:
            httpGet: { path: /v1/rails/configs, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config-src/gold }
      volumes:
        - name: config
          configMap: { name: {{ $name }}-guardrails }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-guardrails
  labels: {{- include "gold.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: guardrails
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- end }}
