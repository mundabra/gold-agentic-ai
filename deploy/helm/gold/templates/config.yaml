{{- $name := include "gold.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-env
  labels: {{- include "gold.labels" . | nindent 4 }}
data:
  GOLD_LLM_BASE_URL: {{ include "gold.llmBaseUrl" . | quote }}
  GOLD_ORCHESTRATOR_MODEL: {{ .Values.llm.orchestratorModel | quote }}
  GOLD_AGENT_MODEL: {{ .Values.llm.agentModel | quote }}
  GOLD_SQL_MODEL: {{ .Values.llm.sqlModel | quote }}
  GOLD_SQL_SYSTEM_PROMPT: {{ .Values.sql.systemPrompt | quote }}
  GOLD_SQL_INCLUDE_SCHEMA: {{ .Values.sql.includeSchema | quote }}
  GOLD_SQL_PASS_DEFINITIONS: {{ .Values.sql.passDefinitions | quote }}
  GOLD_SQL_MAX_TOKENS: {{ .Values.sql.maxTokens | int64 | quote }}
  GOLD_SQL_EXTRA_BODY: {{ .Values.sql.extraBody | quote }}
  GOLD_AGENT_EXTRA_BODY: {{ .Values.agentExtraBody | quote }}
  GOLD_MAX_ROWS: {{ .Values.governance.maxRows | int64 | quote }}
  GOLD_MAX_QUERY_COST: {{ .Values.governance.maxQueryCost | int64 | quote }}
  GOLD_PII_COLUMNS: {{ .Values.governance.piiColumns | quote }}
  GOLD_OPENAI_TRACING: {{ .Values.governance.openaiTracing | quote }}
  GOLD_DB_SCHEMAS: {{ .Values.database.schemas | quote }}
  GOLD_AUTH_MODE: {{ .Values.auth.mode | quote }}
  GOLD_REQUIRE_IDENTITY: {{ .Values.auth.requireIdentity | quote }}
  GOLD_AUTH_USER_HEADER: {{ .Values.auth.userHeader | quote }}
  GOLD_AUTH_GROUPS_HEADER: {{ .Values.auth.groupsHeader | quote }}
  GOLD_OIDC_JWKS_URL: {{ .Values.auth.oidc.jwksUrl | quote }}
  GOLD_OIDC_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  GOLD_OIDC_AUDIENCE: {{ .Values.auth.oidc.audience | quote }}
  GOLD_OIDC_USER_CLAIM: {{ .Values.auth.oidc.userClaim | quote }}
  GOLD_OIDC_GROUPS_CLAIM: {{ .Values.auth.oidc.groupsClaim | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}
  GOLD_TRACE_CONTENT: {{ .Values.tracing.content | quote }}
  GOLD_AUDIT_LOG: {{ .Values.audit.logFile | quote }}
  {{- if .Values.guardrails.enabled }}
  GOLD_RAILS_URL: "http://{{ $name }}-guardrails:8000"
  GOLD_RAILS_MODEL: {{ .Values.guardrails.model | quote }}
  GOLD_RAILS_CHECK_ANSWERS: {{ .Values.guardrails.checkAnswers | quote }}
  GOLD_RAILS_FAIL_OPEN: {{ .Values.guardrails.failOpen | quote }}
  {{- end }}
  GOLD_REGISTRY_URL: "http://{{ $name }}-registry:8000"
  GOLD_DATA_MCP_URL: "http://{{ $name }}-mcp-data:8000/mcp"
  GOLD_GLOSSARY_MCP_URL: "http://{{ $name }}-mcp-glossary:8000/mcp"
---
{{- if not .Values.llm.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-llm
  labels: {{- include "gold.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ .Values.llm.apiKey | quote }}
  registryToken: {{ .Values.registry.token | quote }}
  {{- /* Identity secret: the value you set, else the one from a previous install, else a new random one. */}}
  {{- $identitySecret := .Values.auth.identitySecret }}
  {{- if not $identitySecret }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-llm" $name) }}
  {{- if and $existing $existing.data (hasKey $existing.data "identitySecret") }}
  {{- $identitySecret = index $existing.data "identitySecret" | b64dec }}
  {{- else }}
  {{- $identitySecret = randAlphaNum 40 }}
  {{- end }}
  {{- end }}
  identitySecret: {{ $identitySecret | quote }}
---
{{- end }}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-db
  labels: {{- include "gold.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  url: {{ .Values.database.url | quote }}
  {{- else }}
  url: "postgresql://gold_reader:{{ .Values.postgres.readerPassword }}@{{ $name }}-postgres:5432/gold"
  {{- end }}
  glossaryUrl: {{ .Values.database.glossaryUrl | quote }}
  {{- if .Values.feedback.enabled }}
  {{- if .Values.database.feedbackUrl }}
  feedbackUrl: {{ .Values.database.feedbackUrl | quote }}
  {{- else if .Values.postgres.enabled }}
  feedbackUrl: "postgresql://gold_feedback:{{ .Values.postgres.feedbackPassword }}@{{ $name }}-postgres:5432/gold"
  {{- end }}
  {{- end }}
{{- end }}
