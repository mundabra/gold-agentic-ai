# GOLD Helm values. Defaults give a working install with the scripted stand-in
# model, so you can see the whole flow before connecting a real one.

image:
  repository: ghcr.io/mundabra/gold-agentic-ai   # published on each release; or build the Dockerfile yourself
  tag: "0.5.0"
  pullPolicy: IfNotPresent

# --- Models. Every model call goes to one OpenAI-compatible endpoint.
llm:
  # Leave empty to use the gateway (if enabled), else the scripted model.
  baseUrl: ""
  apiKey: "sk-gold-local"       # stored in a Secret; or use existingSecret (key: apiKey). Also the gateway's master key (must start with "sk-").
  existingSecret: ""
  orchestratorModel: gold-general
  agentModel: gold-general
  sqlModel: gold-sql
  embeddingModel: gold-embed    # for knowledge retrieval

# The SQL model's prompt contract. A fine-tuned model must see exactly the
# prompt it was trained on.
sql:
  systemPrompt: ""
  includeSchema: true
  passDefinitions: true
  maxTokens: 2048
  extraBody: ""                  # JSON sent with every SQL-model request, e.g. to turn reasoning off

# JSON sent with every orchestrator and agent model request.
agentExtraBody: ""

# Guardrails on every query.
governance:
  maxRows: 50
  maxQueryCost: 1000000          # dry-run limit on the planner's cost estimate; 0 turns it off
  piiColumns: "email,phone,fax,address"
  openaiTracing: false           # the Agents SDK's trace export to OpenAI stays off unless you opt in

# Identity: who is asking, enforced by Postgres row-level security (docs/identity.md).
auth:
  mode: none                     # none | proxy | oidc | demo
  requireIdentity: false         # refuse questions without a signed-in user
  identitySecret: ""             # shared by all GOLD services; generated when empty
  userHeader: X-Forwarded-User   # proxy mode
  groupsHeader: X-Forwarded-Groups
  oidc:
    jwksUrl: ""
    issuer: ""
    audience: ""
    userClaim: email
    groupsClaim: groups

# OpenTelemetry tracing across every GOLD service. Set an OTLP/HTTP endpoint
# (an OpenTelemetry Collector, Jaeger, Grafana Tempo or your APM) to turn it on.
tracing:
  otlpEndpoint: ""               # e.g. http://otel-collector.observability:4318
  content: false                 # true puts prompts, SQL and results into spans

# NVIDIA NeMo Guardrails (optional): input rails on every question, output rails on
# every answer if checkAnswers is true. The rails' self-checks use the same model
# endpoint as GOLD (llm.baseUrl or the gateway). Config: files/guardrails/.
guardrails:
  enabled: false
  image: ghcr.io/mundabra/gold-agentic-ai-guardrails:0.5.0
  model: gold-general              # the model the policy self-checks use
  checkAnswers: true
  failOpen: false                  # block questions if the rails server is unreachable

# Audit trail: one JSON record per question on stdout (collect it with your log pipeline).
# Optionally also appended to a file, e.g. on a mounted volume.
audit:
  logFile: ""

# Shared secret agents need to register with the registry. Leave empty only on a trusted network.
registry:
  token: ""

# --- Business database. Use the bundled Postgres with the sample data, or
# point at your own read-only replica with a read-only login.
database:
  url: ""                        # e.g. postgresql://reader:pass@db:5432/sales (overrides postgres.*)
  glossaryUrl: ""                # optional separate database for the glossary table
  existingSecret: ""             # or a Secret with keys: url (and optionally glossaryUrl)
  schemas: "public"              # schemas the SQL agent may see and query
  feedbackUrl: ""                # insert-only login for the feedback queue (default: the bundled Postgres)
  crmUrl: ""                     # Sales copilot: the login that can only add CRM activities (default: the bundled Postgres)

# Feedback loop: "Useful" / "Not right" in the UI, reviewed with `gold feedback`.
feedback:
  enabled: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg17
  adminPassword: gold_admin
  readerPassword: gold_reader
  feedbackPassword: gold_feedback
  curatorPassword: gold_curator
  crmPassword: gold_crm_writer
  knowledgePassword: gold_knowledge
  storage: 2Gi

# Knowledge retrieval (docs/knowledge.md): passages and embeddings in pgvector, in the bundled
# Postgres by default. Or a knowledge base served through the OpenAI Vector Stores API
# (e.g. "vectorstores+https://your-gateway/v1", search only).
knowledge:
  url: ""                        # default: the bundled Postgres, as the gold_knowledge login

# --- Apps: what GOLD serves (apps/*/app.yaml). Empty = every app in the image.
apps:
  enabled: []                    # e.g. [data-analyst]; also remove the other apps' components below
  default: ""                    # the app the UI opens on (default: the first)

# --- GOLD components (same image, different command). Platform: orchestrator, registry.
components:
  orchestrator: { replicas: 1 }
  registry: { replicas: 1 }       # in-memory: keep at 1
  # Talk to your Data (apps/data_analyst)
  sql-agent: { replicas: 1 }
  definitions-agent: { replicas: 1 }
  mcp-data: { replicas: 1 }
  mcp-glossary: { replicas: 1 }
  mcp-knowledge: { replicas: 1 }   # platform: document search for every app
  # Sales copilot (apps/sales_copilot)
  account-agent: { replicas: 1 }
  mcp-crm: { replicas: 1 }

resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { memory: 512Mi }

# Extra environment variables for every GOLD component, e.g. [{name: FOO, value: bar}].
extraEnv: []

# Only the connections GOLD needs are allowed (requires a CNI that enforces NetworkPolicy).
networkPolicy:
  enabled: false

service:
  type: ClusterIP                # the orchestrator (UI + API) on port 80

ingress:
  enabled: false
  className: ""
  host: gold.example.com
  tls: []

# Scripted stand-in model with canned answers. For a first look and for smoke tests.
scriptedModel:
  enabled: true

# --- Stages 2 and 3: LiteLLM gateway. GOLD asks for the aliases below; the
# gateway decides which endpoint serves them.
gateway:
  enabled: false
  image: ghcr.io/berriai/litellm:main-stable
  models:
    - alias: gold-general
      model: openai/your-tool-calling-model     # "openai/" = any OpenAI-compatible server
      apiBase: https://your-provider.example/v1
      apiKeyEnv: GENERAL_API_KEY
    - alias: gold-embed
      model: openai/your-embedding-model
      apiBase: https://your-provider.example/v1
      apiKeyEnv: GENERAL_API_KEY
    - alias: gold-sql
      model: openai/gold-sql                     # served by the vLLM server below
      apiBase: "http://{{ .Release.Name }}-vllm-sql:8000/v1"   # templated: follows your release name
      apiKeyEnv: ""
  # Provider keys, stored in a Secret and exposed to the gateway as env vars.
  providerKeys: {}
  #  GENERAL_API_KEY: "..."

# --- Stage 3: serve open models on your own GPUs with vLLM.
vllm:
  enabled: false
  image: vllm/vllm-openai:latest               # pin to a version you have tested
  servers:
    - name: sql
      model: Qwen/Qwen2.5-Coder-7B-Instruct
      servedModelName: gold-sql-base
      # Serve a LoRA adapter from stage 2 under the name GOLD asks for.
      loraModules: "gold-sql=/adapters/gold-sql"
      adapterClaim: gold-sql-adapters            # PVC holding adapters/gold-sql
      gpus: 1
      extraArgs: ["--max-model-len", "8192"]       # add "--max-lora-rank", "32" for adapters above rank 16
    # A general model with tool calling for the agents, for example:
    # - name: general
    #   model: Qwen/Qwen2.5-32B-Instruct
    #   servedModelName: gold-general
    #   gpus: 2
    #   extraArgs: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes", "--tensor-parallel-size", "2"]
  huggingFaceTokenSecret: ""                     # Secret with key: token, for gated models
  nodeSelector: {}
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
