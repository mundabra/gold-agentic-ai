# GOLD on NVIDIA Nemotron models, served with vLLM on your GPUs.
#
#   helm upgrade --install gold deploy/helm/gold -f deploy/helm/gold/profiles/nemotron.yaml
#
# Roles:
#   gold-general  NVIDIA Nemotron 3 Super (120B total, 12B active, FP8): tool calling for the
#                 orchestrator and agents. 4 GPUs of the 80 GB class; on a B200/B300 it fits on
#                 1 GPU (set gpus: 1, --tensor-parallel-size 1, and drop --enable-expert-parallel).
#   gold-sql      NVIDIA Nemotron 3.5 Lightning (30B total, 3B active): SQL, reasoning off. 1 GPU.
#
# Licences: Nemotron 3 Super uses the NVIDIA Nemotron Open Model License, Nemotron 3.5
# Lightning uses OpenMDW-1.1. Read them before production use.
# Model ids and vLLM flags follow the Hugging Face model cards (checked 24 September 2026),
# with the context window cut from the cards' 256k to what GOLD needs. This profile renders
# and lints in CI; run `gold eval` and scripts/aiperf.sh on your GPUs before switching traffic.

scriptedModel:
  enabled: false

gateway:
  enabled: true
  models:
    - alias: gold-general
      model: openai/gold-general
      apiBase: "http://{{ .Release.Name }}-vllm-general:8000/v1"
      apiKeyEnv: ""
    - alias: gold-sql
      model: openai/gold-sql
      apiBase: "http://{{ .Release.Name }}-vllm-sql:8000/v1"
      apiKeyEnv: ""

vllm:
  enabled: true
  image: vllm/vllm-openai:v0.27.1        # Nemotron 3.5 Lightning needs vLLM 0.27.1 or later
  servers:
    - name: general
      model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
      servedModelName: gold-general
      gpus: 4
      extraArgs:
        - "--trust-remote-code"
        - "--tensor-parallel-size"
        - "4"
        - "--enable-expert-parallel"
        - "--kv-cache-dtype"
        - "fp8"
        - "--mamba-ssm-cache-dtype"
        - "float32"
        - "--max-model-len"
        - "32768"
        - "--enable-chunked-prefill"
        - "--async-scheduling"
        - "--reasoning-parser"
        - "nemotron_v3"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser"
        - "qwen3_coder"
    - name: sql
      model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
      servedModelName: gold-sql
      gpus: 1
      extraArgs:
        - "--max-model-len"
        - "16384"
        - "--max-num-seqs"
        - "128"
        - "--enable-prefix-caching"
        - "--async-scheduling"
        - "--mamba-backend"
        - "flashinfer"
        - "--mamba-ssm-cache-dtype"
        - "float16"
        - "--enable-mamba-cache-stochastic-rounding"
        - "--mamba-cache-philox-rounds"
        - "5"
        - "--reasoning-parser"
        - "nemotron_v3"

# Turn reasoning off for SQL generation: with agreed definitions in the prompt it rarely
# helps, and it makes answers slower (see apps/data_analyst/evals/PERFORMANCE.md). Measure it on your data.
sql:
  extraBody: '{"chat_template_kwargs": {"enable_thinking": false}}'
