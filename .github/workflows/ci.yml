name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned by digest so a re-tagged upstream image can't change what the tests run against.
  POSTGRES_IMAGE: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]   # requires-python is >=3.11
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Start Postgres with the sample data and glossary
        run: |
          docker run -d --name gold-test-pg -p 55432:5432 \
            -e POSTGRES_DB=gold -e POSTGRES_USER=gold_admin -e POSTGRES_PASSWORD=gold_admin \
            -v "$PWD/deploy/postgres:/docker-entrypoint-initdb.d:ro" "$POSTGRES_IMAGE"
          for i in $(seq 1 60); do
            [ "$(docker logs gold-test-pg 2>&1 | grep -c 'ready to accept')" -ge 2 ] && break
            sleep 1
          done
      - run: pip install -e ".[dev,sessions]"   # sessions: also tests the shared Postgres conversation store
      - name: Unit tests and the full multi-agent flow (scripted model)
        run: pytest -q
      - name: Every approved example query is valid and held out from the evaluation
        run: GOLD_DATABASE_URL=postgresql://gold_reader:gold_reader@localhost:55432/gold gold verify-queries

  # The required check. It lints, audits dependencies and passes only if every pytest run passed.
  # (Secret scanning and push protection are GitHub's own, switched on for the repository.)
  test:
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Python version passed
        run: test "${{ needs.pytest.result }}" = success
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sessions,auth,otel]" ruff pip-audit
      - name: Lint (pyflakes, syntax errors, import order)
        run: ruff check gold apps tests --select F,E9,I
      - name: No dependency with a known vulnerability
        run: pip-audit --skip-editable

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: helm version   # preinstalled on GitHub's Ubuntu runners
      - name: Chart files match the SQL and rails the services load
        run: |
          diff -r deploy/postgres deploy/helm/gold/files/postgres
          diff deploy/guardrails/gold/config.yml deploy/helm/gold/files/guardrails/config.yml
          diff deploy/guardrails/gold/prompts.yml deploy/helm/gold/files/guardrails/prompts.yml
      - run: helm lint deploy/helm/gold
      - run: |
          helm template gold deploy/helm/gold > /dev/null
          helm template gold deploy/helm/gold --set gateway.enabled=true --set vllm.enabled=true \
            --set scriptedModel.enabled=false --set ingress.enabled=true --set networkPolicy.enabled=true \
            --set guardrails.enabled=true > /dev/null
          helm lint deploy/helm/gold -f deploy/helm/gold/profiles/nemotron.yaml
          helm template gold deploy/helm/gold -f deploy/helm/gold/profiles/nemotron.yaml > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t gold:ci .
      - run: docker build -t gold-guardrails:ci deploy/guardrails
      - name: No fixable critical vulnerability in the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress gold:ci
