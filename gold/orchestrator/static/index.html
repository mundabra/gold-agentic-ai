<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLD</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20width%3D%2264%22%20height%3D%2264%22%20role%3D%22img%22%20aria-label%3D%22GOLD%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22gold-bg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F2CB6B%22/%3E%20%3Cstop%20offset%3D%220.55%22%20stop-color%3D%22%23C8921E%22/%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238A5A0E%22/%3E%20%3C/linearGradient%3E%20%3C/defs%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23gold-bg%29%22/%3E%20%3Cpath%20d%3D%22M43.9%2021.2%20A15.5%2015.5%200%201%200%2047.5%2032%20H40.5%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%20%3Ccircle%20cx%3D%2231.5%22%20cy%3D%2232%22%20r%3D%223.6%22%20fill%3D%22%23FFFFFF%22/%3E%20%3C/svg%3E">
<style>
  :root {
    --ground: #F3F4F2;
    --surface: #FFFFFF;
    --raised: #FAFAF8;
    --ink: #1C1F22;
    --muted: #61676E;
    --rule: #DADDDA;
    --gold: #9A6B12;
    --gold-soft: #F6EEDC;
    --ok: #2F7D4F;
    --bad: #B23A30;
    --code: #EEF0EE;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #121416;
      --surface: #1A1D20;
      --raised: #1F2327;
      --ink: #E7E9EA;
      --muted: #9AA1A8;
      --rule: #2E3338;
      --gold: #E0B45A;
      --gold-soft: #2C2415;
      --ok: #6CC08F;
      --bad: #F08A80;
      --code: #24282C;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--sans); }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--rule); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { flex: none; }
  .brand b { font-size: 20px; font-weight: 800; letter-spacing: 0.16em; color: var(--ink); }
  .brand span { color: var(--muted); font-size: 13px; }
  .agents { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .who { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .who select { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 6px; }
  .chip { border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .chip.off i { background: var(--bad); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: calc(100% - 59px); }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; height: auto; } }

  .chat { display: flex; flex-direction: column; min-height: 0; }
  .log { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
  .msg { max-width: 820px; }
  .msg.user { align-self: flex-end; background: var(--gold-soft); border-radius: 10px; padding: 10px 14px; }
  .msg.bot { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px; }
  .msg.bot.blocked { border-color: var(--bad); }
  .msg .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .msg p { margin: 0 0 10px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg h3, .msg h4 { margin: 12px 0 6px; font-size: 15px; }
  .msg ul { margin: 0 0 10px; padding-left: 20px; }
  pre { background: var(--code); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.5 var(--mono); margin: 0 0 10px; white-space: pre; }
  code { font-family: var(--mono); font-size: 0.9em; background: var(--code); padding: 1px 4px; border-radius: 3px; }
  pre code { background: none; padding: 0; }
  .tbl { overflow-x: auto; margin: 0 0 10px; }
  table { border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--rule); padding: 5px 12px 5px 0; text-align: left; }
  th { font-weight: 600; }

  .empty { margin: auto; max-width: 620px; text-align: center; color: var(--muted); padding: 40px 0; }
  .empty .hero-mark { display: block; margin: 0 auto 18px; filter: drop-shadow(0 6px 18px rgba(154, 107, 18, 0.25)); }
  .empty h1 { color: var(--ink); font-size: 24px; margin: 0 0 8px; font-weight: 650; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .examples button { font: inherit; font-size: 13.5px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .examples button:hover { border-color: var(--gold); }

  form { display: flex; gap: 10px; padding: 14px 20px 18px; border-top: 1px solid var(--rule); background: var(--surface); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; min-height: 46px; max-height: 160px; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .send { font: inherit; font-weight: 600; background: var(--gold); color: var(--surface); border: 0; border-radius: 8px; padding: 0 20px; cursor: pointer; }
  .send:disabled { opacity: 0.5; cursor: default; }

  aside { border-left: 1px solid var(--rule); background: var(--surface); overflow-y: auto; padding: 20px; }
  @media (max-width: 960px) { aside { border-left: 0; border-top: 1px solid var(--rule); } }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13.5px; }
  .call { border: 1px solid var(--rule); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--raised); }
  .call-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 14px; }
  .call-head small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .call-req { color: var(--muted); font-size: 13px; margin: 6px 0 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .step { font-size: 12.5px; margin-top: 8px; }
  .step b { font-family: var(--mono); font-weight: 500; color: var(--gold); }
  .step pre { margin-top: 4px; font-size: 11.5px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .msg pre { white-space: pre-wrap; word-break: break-word; }
  .chart { margin: 4px 0 12px; }
  .chart figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chart svg { width: 100%; max-width: 680px; height: auto; display: block; }
  .chart .bar { fill: var(--gold); }
  .chart .line { fill: none; stroke: var(--gold); stroke-width: 2.2; }
  .chart .dot { fill: var(--gold); }
  .chart .axis { stroke: var(--rule); stroke-width: 1; }
  .chart text { fill: var(--muted); font: 11.5px var(--sans); }
  .chart .val { fill: var(--ink); font-variant-numeric: tabular-nums; }
  .rate { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .rate button { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .rate button:hover { border-color: var(--gold); }
  .rate form { display: grid; gap: 6px; width: 100%; }
  .rate textarea { font: 12.5px var(--sans); color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
  .rate textarea.sql { font-family: var(--mono); }
  .apps { display: flex; gap: 4px; background: var(--raised); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
  .apps button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .apps button[aria-pressed="true"] { background: var(--gold); color: var(--surface); font-weight: 600; }
  .action { border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .action b { display: block; margin-bottom: 4px; }
  .action dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 6px 0 8px; font-size: 13px; }
  .action dt { color: var(--muted); }
  .action dd { margin: 0; }
  .action .buttons { display: flex; gap: 8px; }
  .action button { font: inherit; font-size: 13px; border-radius: 6px; padding: 4px 14px; cursor: pointer; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
  .action button.approve { background: var(--gold); border-color: var(--gold); color: var(--surface); font-weight: 600; }
  .action .outcome { font-size: 13px; }
  .action .outcome.ok { color: var(--ok); }
  .action .outcome.no { color: var(--bad); }
  .sources { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .sources ol { margin: 4px 0 0; padding-left: 20px; }
  .sources li span { color: var(--muted); }
  .totals { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px; font-variant-numeric: tabular-nums; }
  .fail { color: var(--bad); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) { .thinking::after { content: " …"; animation: blink 1.2s infinite; } }
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="mark" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"> <defs> <linearGradient id="mark-bg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#F2CB6B"/> <stop offset="0.55" stop-color="#C8921E"/> <stop offset="1" stop-color="#8A5A0E"/> </linearGradient> </defs> <rect width="64" height="64" rx="16" fill="url(#mark-bg)"/> <path d="M43.9 21.2 A15.5 15.5 0 1 0 47.5 32 H40.5" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/> <circle cx="31.5" cy="32" r="3.6" fill="#FFFFFF"/> </svg><b>GOLD</b><span id="tagline"></span></div>
  <nav class="apps" id="apps" aria-label="Apps"></nav>
  <div class="agents" id="agents" aria-live="polite"></div>
  <div class="who" id="who"></div>
</header>
<main>
  <section class="chat">
    <div class="log" id="log">
      <div class="empty" id="empty">
        <h1 id="app-title">GOLD</h1>
        <div id="app-description"></div>
        <div class="examples" id="examples"></div>
      </div>
    </div>
    <form id="form">
      <label for="q" class="hint" style="position:absolute;left:-9999px">Question</label>
      <textarea id="q" rows="1" placeholder="Ask a question"></textarea>
      <button class="send" id="send" type="submit">Ask</button>
    </form>
  </section>
  <aside>
    <h2>How this answer was made</h2>
    <div id="trace"><p class="hint">Each answer lists which agents were called, the tools they used, any SQL that ran, and what it cost in tokens and time.</p></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const HERO_MARK = `<svg class="hero-mark" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"> <defs> <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#F2CB6B"/> <stop offset="0.55" stop-color="#C8921E"/> <stop offset="1" stop-color="#8A5A0E"/> </linearGradient> </defs> <rect width="64" height="64" rx="16" fill="url(#hero-bg)"/> <path d="M43.9 21.2 A15.5 15.5 0 1 0 47.5 32 H40.5" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/> <circle cx="31.5" cy="32" r="3.6" fill="#FFFFFF"/> </svg>`;
let apps = [];        // from api/apps: what this GOLD serves
let current = null;   // the selected app
let sessionId = null;
let demoUser = null;  // demo mode only: whose view of the data to show
let feedbackOn = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>");
}
// Small markdown renderer: code blocks, tables, headings, bullets, paragraphs.
function md(text) {
  const lines = String(text).replace(/\r/g, "").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; ) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      const body = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) body.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
    } else if (line.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => r.replace(/[|:\-\s]/g, "") !== "");
      const head = cells(body[0] || "");
      const rest = body.slice(1);
      out.push(`<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${rest
        .map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`)
        .join("")}</tbody></table></div>`);
    } else if (/^#{1,6}\s/.test(line)) {
      out.push(`<h4>${inline(line.replace(/^#+\s*/, ""))}</h4>`);
      i++;
    } else if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, ""));
      out.push(`<ul>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</ul>`);
    } else if (!line.trim()) {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^(\s*[-*]\s+|#|\||```)/.test(lines[i].trim())) para.push(lines[i++]);
      out.push(`<p>${inline(para.join(" "))}</p>`);
    }
  }
  return out.join("");
}

function addMessage(role, html, extraClass = "") {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role} ${extraClass}`;
  div.innerHTML = html;
  $("log").appendChild(div);
  div.scrollIntoView({ block: "end" });
  return div;
}

function stepInput(step) {
  const input = step.input || {};
  if (typeof input === "object" && !Object.keys(input).length) return "";
  if (typeof input === "object" && input.sql) return input.sql;
  if (typeof input === "object" && input.question) return input.question + (input.definitions ? `\n\n${input.definitions}` : "");
  return typeof input === "string" ? input : JSON.stringify(input, null, 1);
}

// Charts come from the query's own result rows, never from the model's text, so a
// chart can't disagree with the data. Bar for categories, line for time.
const TIME_COLUMN = /(^|_)(year|month|quarter|week|day|date|period)(_|$)/i;
const isNum = (v) => v !== null && v !== "" && typeof v !== "boolean" && !isNaN(Number(v));
const fmt = (n) => Math.abs(n) >= 1000 ? Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 }) : String(Math.round(n * 100) / 100);

function chartFor(result) {
  if (!result || !Array.isArray(result.rows) || !Array.isArray(result.columns)) return "";
  const { columns, rows } = result;
  if (rows.length < 2 || rows.length > 60 || columns.length < 2) return "";
  const valueIdx = columns.map((_, i) => i).reverse().find((i) => !/(^|_)id$/i.test(columns[i]) && rows.every((r) => isNum(r[i])));
  if (valueIdx === undefined) return "";
  const labelIdx = columns.findIndex((c, i) => i !== valueIdx && (TIME_COLUMN.test(c) || !rows.every((r) => isNum(r[i]))));
  if (labelIdx < 0) return "";
  const points = rows.map((r) => ({ label: String(r[labelIdx]).replace(/\.0$/, "").replace(/T00:00:00$/, ""), value: Number(r[valueIdx]) }));
  const caption = `${esc(columns[valueIdx])} by ${esc(columns[labelIdx])}, from the query result`;
  return TIME_COLUMN.test(columns[labelIdx]) || points.every((p) => /^\d{4}(-\d{2})?(-\d{2})?$/.test(p.label))
    ? lineChart(points.sort(byLabel), caption)
    : barChart(points.sort((a, b) => b.value - a.value).slice(0, 20), caption, rows.length);
}

// Numbers sort as numbers (month 2 before month 10); dates and text sort as text.
const byLabel = (a, b) => (isNum(a.label) && isNum(b.label) ? Number(a.label) - Number(b.label) : a.label < b.label ? -1 : a.label > b.label ? 1 : 0);

function barChart(points, caption, total) {
  const max = Math.max(...points.map((p) => p.value), 0) || 1, row = 22, left = 150, width = 640;
  const bars = points.map((p, i) => {
    const w = Math.max(1, (Math.max(p.value, 0) / max) * (width - left - 70)), y = 8 + i * row;
    return `<text x="${left - 8}" y="${y + 14}" text-anchor="end">${esc(p.label.slice(0, 22))}</text>
      <rect class="bar" x="${left}" y="${y + 3}" width="${w}" height="${row - 7}" rx="2"/>
      <text class="val" x="${left + w + 6}" y="${y + 14}">${fmt(p.value)}</text>`;
  }).join("");
  const more = total > points.length ? ` (top ${points.length} of ${total})` : "";
  return `<figure class="chart"><svg viewBox="0 0 ${width} ${points.length * row + 14}" role="img" aria-label="${caption}">${bars}</svg><figcaption>${caption}${more}</figcaption></figure>`;
}

function lineChart(points, caption) {
  const width = 640, height = 220, pad = { l: 56, r: 16, t: 14, b: 30 };
  const values = points.map((p) => p.value), max = Math.max(...values), min = Math.min(0, ...values);
  const x = (i) => pad.l + (i * (width - pad.l - pad.r)) / Math.max(points.length - 1, 1);
  const y = (v) => pad.t + ((max - v) / ((max - min) || 1)) * (height - pad.t - pad.b);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const every = Math.ceil(points.length / 12);
  const labels = points.map((p, i) => (i % every ? "" : `<text x="${x(i)}" y="${height - 10}" text-anchor="middle">${esc(p.label)}</text>`)).join("");
  const dots = points.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.value)}" r="3"><title>${esc(p.label)}: ${fmt(p.value)}</title></circle>`).join("");
  return `<figure class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${caption}">
    <line class="axis" x1="${pad.l}" y1="${y(min)}" x2="${width - pad.r}" y2="${y(min)}"/>
    <text x="${pad.l - 8}" y="${y(max) + 4}" text-anchor="end">${fmt(max)}</text>
    <text x="${pad.l - 8}" y="${y(min) + 4}" text-anchor="end">${fmt(min)}</text>
    <path class="line" d="${path}"/>${dots}${labels}</svg><figcaption>${caption}</figcaption></figure>`;
}

// The last tool result shaped as a table (run_sql, and any app tool that returns columns + rows).
function lastResult(body) {
  const runs = body.calls.flatMap((c) => c.steps).filter((s) => s.output && Array.isArray(s.output.rows) && Array.isArray(s.output.columns));
  return runs.length ? runs[runs.length - 1].output : null;
}

function renderTrace(body) {
  if (body.blocked && !body.calls.length) {
    $("trace").innerHTML = `<p class="hint">Stopped by ${esc(body.blocked_by || "a guardrail")} before any agent ran.</p>`;
    return;
  }
  const calls = body.calls.map((c) => `
    <div class="call">
      <div class="call-head"><span>${esc(c.agent)}</span><small>${(c.elapsed_ms / 1000).toFixed(1)} s · ${c.usage.total_tokens || 0} tok</small></div>
      <div class="call-req">${esc(c.request)}</div>
      ${c.failure ? `<div class="fail">${esc(c.failure)}</div>` : ""}
      ${c.steps.map((s) => { const input = stepInput(s); return `<div class="step"><b>${esc(s.tool)}</b>${input ? `<pre>${esc(input)}</pre>` : ""}</div>`; }).join("")}
    </div>`).join("");
  const u = body.usage || {};
  $("trace").innerHTML = (calls || `<p class="hint">No specialist agents were called.</p>`) +
    `<div class="totals">${u.model_requests || 0} model calls · ${u.input_tokens || 0} in / ${u.output_tokens || 0} out tokens · ${(body.elapsed_ms / 1000).toFixed(1)} s</div>`;
}

async function ask(question) {
  question = question.trim();
  if (!question) return;
  addMessage("user", esc(question));
  const pending = addMessage("bot", `<span class="thinking">Asking the agents</span>`);
  $("send").disabled = true;
  $("q").value = "";
  try {
    const res = await fetch("api/ask", {
      method: "POST",
      headers: headersJson(),
      body: JSON.stringify({ question, app: current && current.name, session_id: sessionId }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.statusText);
    sessionId = body.session_id;
    pending.innerHTML = chartFor(lastResult(body)) + md(body.answer) + sourcesFor(body) + `<div class="meta">${body.calls.length} agent calls · ${(body.elapsed_ms / 1000).toFixed(1)} s</div>`;
    (body.actions || []).forEach((a) => addAction(pending, a));
    if (feedbackOn && body.answer_id) addRating(pending, body, question);
    if (body.blocked) pending.classList.add("blocked");
    renderTrace(body);
  } catch (err) {
    pending.classList.add("blocked");
    pending.innerHTML = `<p>Something went wrong: ${esc(err.message)}</p>`;
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
}

// Passages from search_knowledge that the answer drew on, as a numbered list of sources.
function sourcesFor(body) {
  const seen = new Map();
  body.calls.flatMap((c) => c.steps).filter((s) => s.tool === "search_knowledge" && s.output && Array.isArray(s.output.results))
    .forEach((s) => s.output.results.forEach((r) => {
      // Models don't always keep the brackets, so match the "Title › Section" inside them.
      if (body.answer.includes(r.cite.replace(/^\[|\]$/g, ""))) seen.set(r.cite, r);
    }));
  // If the answer didn't quote a citation, list the documents the agent read instead.
  let label = "Sources";
  if (!seen.size) {
    label = "Sources the agent read";
    body.calls.flatMap((c) => c.steps).filter((s) => s.tool === "search_knowledge" && s.output && Array.isArray(s.output.results))
      .forEach((s) => s.output.results.forEach((r) => { if (![...seen.values()].some((x) => x.source === r.source)) seen.set(r.cite, r); }));
  }
  if (!seen.size) return "";
  return `<div class="sources">${label}<ol>${[...seen.values()].map((r) =>
    `<li>${esc(r.cite.replace(/^\[|\]$/g, ""))} <span>(${esc(r.source)})</span></li>`).slice(0, 4).join("")}</ol></div>`;
}

// An agent proposed an action. Nothing has happened yet: the person who asked decides.
function addAction(container, action) {
  const box = document.createElement("div");
  box.className = "action";
  const args = Object.entries(action.args || {}).filter(([k, v]) => v !== null && v !== "" && !/_id$/.test(k)).sort();
  box.innerHTML = `<b>Needs your approval</b><div>${esc(action.summary)}</div>
    <dl>${args.map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="buttons"><button type="button" class="approve">Approve</button><button type="button" class="reject">Reject</button></div>`;
  container.appendChild(box);
  const decide = async (verb) => {
    box.querySelectorAll("button").forEach((b) => (b.disabled = true));
    const res = await fetch(`api/actions/${verb}`, { method: "POST", headers: headersJson(), body: JSON.stringify({ ticket: action.ticket }) });
    const out = await res.json().catch(() => ({}));
    const done = res.ok && out.status === "done";
    const text = !res.ok ? `Not done: ${out.detail || res.statusText}`
      : out.status === "rejected" ? "Rejected. Nothing was changed."
      : done ? `Done. ${(out.result && out.result.message) || ""}` : `Not done: ${(out.result && (out.result.reason || out.result.error)) || "the tool refused"}`;
    box.querySelector(".buttons").outerHTML = `<div class="outcome ${done ? "ok" : "no"}">${esc(text)}</div>`;
  };
  box.querySelector(".approve").addEventListener("click", () => decide("approve"));
  box.querySelector(".reject").addEventListener("click", () => decide("reject"));
}

async function loadAgents() {
  try {
    const res = await fetch(`api/agents?app_name=${encodeURIComponent(current ? current.name : "")}`);
    const agents = await res.json();
    $("agents").innerHTML = agents.length
      ? agents.map((a) => `<span class="chip" title="${esc(a.description)}"><i></i>${esc(a.name)}</span>`).join("")
      : `<span class="chip off"><i></i>No agents registered yet</span>`;
  } catch {
    $("agents").innerHTML = `<span class="chip off"><i></i>Registry unreachable</span>`;
  }
}

function headersJson() {
  return Object.assign({ "Content-Type": "application/json" }, demoUser ? { "X-Gold-Demo-User": demoUser } : {});
}

// "Useful" / "Not right": goes to the review queue (gold feedback list).
function addRating(container, body, question) {
  const app = current && current.name;
  const run = body.calls.flatMap((c) => c.steps).filter((s) => s.tool === "run_sql").pop();
  const sql = run && run.input ? run.input.sql : null;
  const box = document.createElement("div");
  box.className = "rate";
  box.innerHTML = `<span>Was this right?</span><button type="button" data-r="up">Useful</button><button type="button" data-r="down">Not right</button>`;
  container.appendChild(box);
  const send = async (rating, comment, corrected) => {
    const res = await fetch("api/feedback", { method: "POST", headers: headersJson(),
      body: JSON.stringify({ app, answer_id: body.answer_id, question, sql, rating, comment, corrected_sql: corrected || null }) });
    const out = await res.json().catch(() => ({}));
    box.textContent = res.ok ? "Thanks. Sent for review." : `Not sent: ${out.detail || res.statusText}`;
  };
  box.addEventListener("click", (e) => {
    const r = e.target.dataset && e.target.dataset.r;
    if (r === "up") send("up");
    if (r === "down") {
      box.innerHTML = `<form><label class="hint" for="c-${body.answer_id}">What was wrong?</label>
        <textarea id="c-${body.answer_id}" name="comment"></textarea>
        <label class="hint" for="s-${body.answer_id}">${sql ? "Correct SQL, if you know it (optional)" : "The right answer, if you know it (optional)"}</label>
        <textarea id="s-${body.answer_id}" class="${sql ? "sql" : ""}" name="sql"></textarea>
        <div><button type="submit">Send for review</button></div></form>`;
      box.querySelector("form").addEventListener("submit", (ev) => {
        ev.preventDefault();
        send("down", ev.target.comment.value, ev.target.sql.value.trim());
      });
    }
  });
}

async function loadIdentity() {
  try {
    feedbackOn = (await (await fetch("api/features")).json()).feedback === true;
  } catch { /* feedback is optional */ }
  try {
    const res = await fetch("api/identity");
    const who = await res.json();
    if (who.mode === "demo" && who.demo_users.length) {
      demoUser = who.demo_users[0];
      $("who").innerHTML = `<label for="viewas">View as</label><select id="viewas">${who.demo_users
        .map((u) => `<option>${esc(u)}</option>`).join("")}</select>`;
      $("viewas").addEventListener("change", (e) => { demoUser = e.target.value; sessionId = null; });
    } else if (who.user) {
      $("who").textContent = `Signed in as ${who.user}`;
    }
  } catch { /* identity is optional */ }
}
loadIdentity();

function selectApp(name) {
  current = apps.find((a) => a.name === name) || apps[0];
  if (!current) return;
  try { localStorage.setItem("gold-app", current.name); } catch { /* storage is optional */ }
  sessionId = null;
  document.title = `${current.title} · GOLD`;
  $("tagline").textContent = apps.length < 2 ? current.title : "";
  $("apps").hidden = apps.length < 2;
  $("apps").innerHTML = apps.map((a) => `<button type="button" data-app="${esc(a.name)}" aria-pressed="${a.name === current.name}" title="${esc(a.description)}">${esc(a.title)}</button>`).join("");
  $("log").innerHTML = `<div class="empty" id="empty">${HERO_MARK}<h1>${esc(current.title)}</h1><div>${esc(current.description)}</div><div class="examples" id="examples"></div></div>`;
  $("examples").innerHTML = ((current.ui && current.ui.examples) || []).map((e) => `<button type="button">${esc(e)}</button>`).join("");
  $("q").placeholder = (current.ui && current.ui.placeholder) || "Ask a question";
  $("trace").innerHTML = `<p class="hint">Each answer lists which agents were called, the tools they used, any SQL that ran, and what it cost in tokens and time.</p>`;
  loadAgents();
}

async function loadApps() {
  try {
    apps = await (await fetch("api/apps")).json();
  } catch { apps = []; }
  let saved = new URLSearchParams(location.search).get("app");
  try { saved = saved || localStorage.getItem("gold-app"); } catch { /* storage is optional */ }
  selectApp(saved);
}
loadApps();

$("apps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) selectApp(b.dataset.app); });
$("log").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON" && e.target.closest("#examples")) ask(e.target.textContent); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask($("q").value); } });
setInterval(loadAgents, 15000);
// Shareable questions: /?ask=... fills in the question; the viewer still clicks Ask.
const preset = new URLSearchParams(location.search).get("ask");
if (preset) $("q").value = preset;
</script>
</body>
