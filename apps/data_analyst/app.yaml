# Talk to your Data: business questions in plain language, answered with governed, read-only SQL.
name: data-analyst
title: Talk to your Data
description: Ask business questions in plain language. Answers come from read-only SQL, with the agreed definitions and the query shown.
instructions: instructions.md
read_only: true            # requests to change data are refused before any model call

# Registry agents this app's orchestrator may call (Agent Card names).
agents: [Definitions agent, SQL agent]

# What `gold serve <component>` runs. Each is its own service (A2A agent or MCP tool server).
components:
  sql-agent: apps.data_analyst.agents.sql_agent
  definitions-agent: apps.data_analyst.agents.definitions_agent
  mcp-data: apps.data_analyst.tools.data_tools
  mcp-glossary: apps.data_analyst.tools.glossary_tools

cli: apps.data_analyst.cli             # gold eval, bench, dataset, verify-queries, aiperf-*, feedback promote
scripted: apps.data_analyst.scripted   # canned replies for the scripted stand-in model
hooks:
  check_correction: apps.data_analyst.curation:check_correction   # validates "Not right" corrections

ui:
  placeholder: What was our revenue by country last year?
  examples:
    - What was our revenue by country last year?
    - Who are our top 5 customers by lifetime value?
    - Which genre earned the most revenue last year?
    - How many active customers do we have?
    - Delete all customers in Brazil
