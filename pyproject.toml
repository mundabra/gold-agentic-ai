[project]
name = "gold-agentic-ai"
version = "0.5.0"
description = "GOLD: an enterprise agentic AI reference architecture. Governed, observable, layered, deployable; with Talk to your Data and a Sales copilot as sample apps."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.22,<0.23",
    "a2a-sdk>=1.1,<2",
    "mcp>=2.2,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "sqlglot>=25",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Sign-in with OIDC bearer tokens (GOLD_AUTH_MODE=oidc).
auth = ["pyjwt[crypto]>=2.8"]
# OpenTelemetry tracing across every service (on when OTEL_EXPORTER_OTLP_ENDPOINT is set).
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-asgi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-psycopg>=0.51b0",
    "openinference-instrumentation-openai-agents>=1.0",
]
# Shared conversation memory in Postgres, for more than one orchestrator replica.
sessions = ["openai-agents[sqlalchemy]>=0.22,<0.23", "sqlalchemy[asyncio]>=2", "asyncpg>=0.29"]

[project.scripts]
gold = "gold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gold", "apps"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
